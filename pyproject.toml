[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "manticore"
version = "0.1.0"
description = "Techno-divination with Stable Diffusion 2.1"
requires-python = ">=3.10"
dependencies = [
    "accelerate==1.15.0",
    "diffusers==0.40.0",
    "huggingface-hub==1.32.0",
    "Pillow==12.3.0",
    "safetensors==0.8.0",
    "torch==2.14.0",
    "torchvision==0.29.0",
    "transformers==5.17.0",
]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
